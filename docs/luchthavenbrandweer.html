<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=block" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luchthavenbrandweer Nederland - DEFENSIEBRANDWEER NL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;700&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">
    <link rel="stylesheet" href="style.css">
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/scrollbar.js"></script>
    <style>
        .table { min-width:760px; }
        .table thead th:nth-child(1) { width:26%; }
        .table thead th:nth-child(2) { width:10%; }
        .table thead th:nth-child(3) { width:10%; }
        .table thead th:nth-child(4) { width:34%; }
        .table thead th:nth-child(5) { width:20%; }
        .table tbody td { vertical-align:top; }
        .table tbody tr:hover { background:#252D1D; }
        .toolbar-right { display:flex; align-items:center; gap:12px; margin-left:auto; }
        .page-size-wrap { position:relative; }
        .custom-page-size { position:relative; }
        .custom-page-size-trigger { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:8px 14px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:4px; font:600 14px 'Barlow',sans-serif; cursor:pointer; transition:border-color 150ms, background-color 150ms; }
        .custom-page-size-trigger:hover { border-color:var(--gold); }
        .custom-page-size-trigger i { font-size:10px; color:var(--text-muted); transition:transform 150ms; }
        .custom-page-size.open .custom-page-size-trigger i { transform:rotate(180deg); }
        .custom-page-size-menu { position:absolute; top:calc(100% + 6px); right:0; min-width:100%; padding:4px; background:var(--surface); border:1px solid var(--border); border-radius:4px; box-shadow:0 12px 32px rgba(0,0,0,.4); opacity:0; visibility:hidden; transform:translateY(-4px); transition:opacity 140ms, transform 140ms, visibility 0s linear 140ms; z-index:50; }
        .custom-page-size.open .custom-page-size-menu { opacity:1; visibility:visible; transform:translateY(0); transition-delay:0s; }
        .custom-page-size-option { display:block; width:100%; text-align:left; padding:8px 12px; border:none; background:transparent; color:var(--text-soft); font:500 14px 'Barlow',sans-serif; border-radius:3px; cursor:pointer; transition:background-color 120ms, color 120ms; }
        .custom-page-size-option:hover { background:var(--olive); color:#FFD078; }
        .custom-page-size-option.active { background:var(--blue); color:#fff; }
        .pagination { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:24px; flex-wrap:wrap; }
        .page-btn { min-height:36px; padding:6px 14px; background:var(--surface); color:var(--text-soft); border:1px solid var(--border); border-radius:4px; font:600 13px 'Barlow',sans-serif; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:background-color 150ms,color 150ms,border-color 150ms; }
        .page-btn:hover:not(:disabled) { background:var(--olive); color:#FFD078; border-color:var(--gold); }
        .page-btn:disabled { opacity:.4; cursor:not-allowed; }
        .page-numbers { display:flex; gap:4px; }
        .page-num { min-width:36px; min-height:36px; padding:6px 10px; background:var(--surface); color:var(--text-soft); border:1px solid var(--border); border-radius:4px; font:600 13px 'Barlow',sans-serif; cursor:pointer; transition:background-color 150ms,color 150ms,border-color 150ms; }
        .page-num:hover { background:var(--olive); color:#FFD078; border-color:var(--gold); }
        .page-num.active { background:var(--gold); color:#000; border-color:var(--gold); }
        .page-info { color:var(--text-muted); font:500 13px 'Barlow',sans-serif; margin-left:8px; }
        .page-btn i { font-size:10px; }
        .skeleton-row td { padding:12px 16px; border-bottom:1px solid rgba(58,65,48,.7); }
        .skeleton-line { display:block; height:15px; border-radius:3px; background:var(--olive); position:relative; overflow:hidden; max-width:100%; }
        .skeleton-line::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent); animation:luchthaven-shimmer 1.4s infinite; }
        .count-skeleton { display:inline-block; width:76px; height:14px; border-radius:3px; background:var(--olive); vertical-align:middle; position:relative; overflow:hidden; }
        .count-skeleton::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent); animation:luchthaven-shimmer 1.4s infinite; }
        @keyframes luchthaven-shimmer { to { transform:translateX(100%); } }
    </style>
</head>
<body class="register-page">
<div id="navbar-placeholder"></div>
<div class="scroll-container"><div class="scroll-content">
<div class="page">
    <div class="kicker">Overzicht — Defensiebrandweer</div>
    <h1>Luchthaven<span>brandweer</span></h1>
    <p class="sub">Overzicht van Nederlandse luchthavens en vliegvelden met hun ICAO/IATA-codes en coördinaten. Nog in ontwikkeling.</p>
    <div class="toolbar">
        <label class="search"><i class="fi fi-rr-search"></i><input type="text" id="searchInput" placeholder="Zoeken op locatie, ICAO, IATA of naam..."></label>
        <div class="toolbar-right">
            <span class="count" id="resultsCount"><span class="count-skeleton" aria-hidden="true"></span></span>
            <div class="page-size-wrap">
                <div class="custom-page-size" id="pageSizeWrap">
                    <button type="button" class="custom-page-size-trigger" id="pageSizeTrigger" aria-haspopup="listbox" aria-expanded="false">
                        <span id="pageSizeLabel">25</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="custom-page-size-menu" id="pageSizeMenu" role="listbox">
                        <button type="button" class="custom-page-size-option" data-value="25">25</button>
                        <button type="button" class="custom-page-size-option" data-value="50">50</button>
                        <button type="button" class="custom-page-size-option active" data-value="100">100</button>
                        <button type="button" class="custom-page-size-option" data-value="all">Alles</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="table-container" id="tableWrap">
        <table class="table" aria-label="Luchthavens laden" aria-busy="true">
            <thead>
                <tr><th>Locatie</th><th>ICAO</th><th>IATA</th><th>Naam luchthaven</th><th>Coördinaten</th></tr>
            </thead>
            <tbody id="airportBody">
                <tr class="skeleton-row" aria-hidden="true"><td><span class="skeleton-line" style="width:120px;height:18px"></span></td><td><span class="skeleton-line" style="width:60px;height:18px"></span></td><td><span class="skeleton-line" style="width:50px;height:18px"></span></td><td><span class="skeleton-line" style="width:180px;height:18px"></span></td><td><span class="skeleton-line" style="width:160px;height:18px"></span></td></tr>
                <tr class="skeleton-row" aria-hidden="true"><td><span class="skeleton-line" style="width:120px;height:18px"></span></td><td><span class="skeleton-line" style="width:60px;height:18px"></span></td><td><span class="skeleton-line" style="width:50px;height:18px"></span></td><td><span class="skeleton-line" style="width:180px;height:18px"></span></td><td><span class="skeleton-line" style="width:160px;height:18px"></span></td></tr>
                <tr class="skeleton-row" aria-hidden="true"><td><span class="skeleton-line" style="width:120px;height:18px"></span></td><td><span class="skeleton-line" style="width:60px;height:18px"></span></td><td><span class="skeleton-line" style="width:50px;height:18px"></span></td><td><span class="skeleton-line" style="width:180px;height:18px"></span></td><td><span class="skeleton-line" style="width:160px;height:18px"></span></td></tr>
                <tr class="skeleton-row" aria-hidden="true"><td><span class="skeleton-line" style="width:120px;height:18px"></span></td><td><span class="skeleton-line" style="width:60px;height:18px"></span></td><td><span class="skeleton-line" style="width:50px;height:18px"></span></td><td><span class="skeleton-line" style="width:180px;height:18px"></span></td><td><span class="skeleton-line" style="width:160px;height:18px"></span></td></tr>
                <tr class="skeleton-row" aria-hidden="true"><td><span class="skeleton-line" style="width:120px;height:18px"></span></td><td><span class="skeleton-line" style="width:60px;height:18px"></span></td><td><span class="skeleton-line" style="width:50px;height:18px"></span></td><td><span class="skeleton-line" style="width:180px;height:18px"></span></td><td><span class="skeleton-line" style="width:160px;height:18px"></span></td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination" id="pagination" style="display:none;">
        <button type="button" class="page-btn" id="prevPage"><i class="fas fa-chevron-left"></i> Vorige</button>
        <div class="page-numbers" id="pageNumbers"></div>
        <button type="button" class="page-btn" id="nextPage">Volgende <i class="fas fa-chevron-right"></i></button>
        <span class="page-info" id="paginationInfo"></span>
    </div>
    <div class="empty" id="noResults" style="display:none;">
        <i class="fi fi-rr-plane"></i>
        <h3>Niets gevonden</h3>
        <p>Pas je zoekopdracht aan.</p>
    </div>
</div>
<div id="footer-placeholder"></div>
</div><div class="custom-scrollbar-body"><div class="scrollbar-thumb"></div></div></div>
<script>
    const AIRPORTS = [
["Ameland","EHAL","","Ameland Airport Ballum","53° 27' 10\" NB, 5° 41' 2\" OL"],
["Haarlemmermeer","EHAM","AMS","Luchthaven Schiphol","52° 18' 30\" NB, 4° 45' 39\" OL"],
["Apeldoorn","EHTE","","Teuge International Airport","52° 14' 29\" NB, 6° 2' 48\" OL"],
["Beek","EHBK","MST","Maastricht Aachen Airport","50° 54' 45\" NB, 5° 46' 10\" OL"],
["Hoeven","EHSE","","Breda International Airport","51° 33′ 17″ NB, 4° 33′ 9″ OL"],
["Budel","EHBD","","Kempen Airport (Luchthaven Budel)","51° 15' 23\" NB, 5° 36' 7\" OL"],
["Den Helder","EHKD","DHR","Vliegveld de Kooy","52° 55' 21\" NB 4° 46' 58\" OL"],
["Drachten","EHDR","","Vliegveld Drachten","53° 7' 5\" NB 6° 7' 42\" OL"],
["Eindhoven","EHEH","EIN","Eindhoven Airport","51° 27' 2\" NB, 5° 22' 27\" OL"],
["Enschede","EHTW","ENS","Twente Airport","52° 16' 27\" NB, 6° 53' 12\" OL"],
["Groningen / Eelde","EHGG","GRQ","Groningen Airport Eelde","53° 7' 14\" NB, 6° 34' 41\" OL"],
["Hilversum","EHHV","","Vliegveld Hilversum","52° 11' 33\" NB, 5° 8' 50\" OL"],
["Hoogeveen","EHHO","","Vliegveld Hoogeveen","52° 43' 51\" NB, 6° 30' 57\" OL"],
["Lelystad","EHLE","LEY","Lelystad Airport","52° 27' 19\" NB 5° 31' 23\" OL"],
["Middelburg (Zeeland)","EHMZ","","Vliegveld Midden-Zeeland","51° 30' 44\" NB, 3° 43' 45\" OL"],
["Middenmeer","EHMM","","Vliegveld Middenmeer","52° 49' 0\" NB, 5° 1' 40\" OL"],
["Numansdorp","EHND","","Vliegveld Numansdorp","51° 45' 11\" NB, 4° 27' 19\" OL"],
["Rotterdam","EHRD","RTM","Rotterdam The Hague Airport","51° 57' 9\" NB, 4° 26' 4\" OL"],
["Stadskanaal","EHST","","Vliegveld Stadskanaal","52° 59' 45\" NB, 7° 1' 15\" OL"],
["Texel","EHTX","","Texel International Airport","53° 06' 55\" NB, 4° 50' 1\" OL"],
["Winschoten","EHOW","","Vliegveld Oostwold","53° 12' 29\" NB, 7° 2' 28\" OL"],
["Concordia, Sint Eustatius","TNCE","EUX","F.D. Roosevelt Airport","17° 29′ 47″ NB 62° 58′ 45″ WL"],
["Kralendijk, Bonaire","TNCB","BON","Bonaire International Airport","12° 07′ 51″ NB 68° 16′ 6″ WL"],
["The Bottom, Saba","TNCS","SAB","Juancho E. Yrausquin Airport","17° 38′ 43″ NB 63°13′ 14″ WL"],
["Ede / Arnhem","EHDL","","Vliegbasis Deelen","52° 3' NB, 5° 52' OL"],
["Gilze-Rijen","EHGR","GLZ","Vliegbasis Gilze-Rijen","51° 34' NB, 4° 55' OL"],
["Leeuwarden","EHLW","LWR","Vliegbasis Leeuwarden","53° 13' NB, 5° 45' OL"],
["Uden","EHVK","UDE","Vliegbasis Volkel","51° 39' NB, 5° 41' OL"],
["Venray","EHDP","","Vliegbasis De Peel","51° 31' NB, 5° 51' OL"],
["Woensdrecht","EHWO","WOE","Vliegbasis Woensdrecht","51° 27' NB, 4° 21' OL"],
["Arnhem","EHTL","","Vliegveld Terlet","52° 03' 26\" NB, 5° 55' 28\" OL"],
["Amsterdam","EHHA","","Amsterdam Heliport","52° 24' NB, 4° 48' OL"],
["Eemshaven","EHHE","","Heliport Eemshaven","53° 27' NB 6° 48' OL"],
["Rotterdam","EHTP","","Heliport Maasvlakte","51° 57' NB, 4° 5' OL"],
["Vlieland","","","Vlieland Heliport","53° 17' 49\" NB, 5° 5' 8\" OL"]
];
    let q = '';
    let pageSize = 100, currentPage = 1, filteredList = [];
    const tbody = document.getElementById('airportBody');
    const count = document.getElementById('resultsCount');
    const search = document.getElementById('searchInput');
    const noRes = document.getElementById('noResults');
    const tableWrap = document.getElementById('tableWrap');
    const pageSizeWrap = document.getElementById('pageSizeWrap');
    const pageSizeTrigger = document.getElementById('pageSizeTrigger');
    const pageSizeLabel = document.getElementById('pageSizeLabel');
    const pageSizeMenu = document.getElementById('pageSizeMenu');
    const pageSizeOptions = pageSizeMenu.querySelectorAll('.custom-page-size-option');
    const pagination = document.getElementById('pagination');
    const paginationInfo = document.getElementById('paginationInfo');
    const prevBtn = document.getElementById('prevPage');
    const nextBtn = document.getElementById('nextPage');
    const pageNumbers = document.getElementById('pageNumbers');
    function esc(s){return (s||'').replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;');}
    function render() {
        const query = q.toLowerCase();
        const list = AIRPORTS.filter(r => !query || r.join(' ').toLowerCase().includes(query));
        filteredList = list;
        const total = list.length;
        const perPage = pageSize === 'all' ? total : pageSize;
        const totalPages = perPage > 0 ? Math.max(1, Math.ceil(total / perPage)) : 1;
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;
        const start = pageSize === 'all' ? 0 : (currentPage - 1) * perPage;
        const shown = pageSize === 'all' ? list : list.slice(start, start + perPage);
        count.textContent = pageSize === 'all' ? `${total} ${total===1?'luchthaven':'luchthavens'}` : `${start+1}-${start+shown.length} van ${total} ${total===1?'luchthaven':'luchthavens'}`;
        if (!list.length) { tableWrap.style.display='none'; noRes.style.display='block'; pagination.style.display='none'; return; }
        tableWrap.style.display=''; noRes.style.display='none';
        tbody.innerHTML = shown.map(r => `<tr><td>${esc(r[0])}</td><td class="muted">${esc(r[1]||'–')}</td><td class="muted">${esc(r[2]||'–')}</td><td>${esc(r[3])}</td><td class="muted">${esc(r[4])}</td></tr>`).join('');
        document.querySelector('.table').removeAttribute('aria-label');
        document.querySelector('.table').removeAttribute('aria-busy');
        if (pageSize === 'all' || totalPages <= 1) {
            pagination.style.display = 'none';
        } else {
            pagination.style.display = 'flex';
            paginationInfo.textContent = `Pagina ${currentPage} van ${totalPages}`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
            let nums = '';
            const maxButtons = 5;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);
            if (endPage - startPage < maxButtons - 1) startPage = Math.max(1, endPage - maxButtons + 1);
            for (let i = startPage; i <= endPage; i++) {
                nums += `<button type="button" class="page-num ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            pageNumbers.innerHTML = nums;
            pageNumbers.querySelectorAll('.page-num').forEach(b => b.addEventListener('click', () => {
                currentPage = parseInt(b.dataset.page, 10);
                render();
            }));
        }
    }
    function setPageSize(value) {
        pageSize = value === 'all' ? 'all' : parseInt(value, 10);
        pageSizeLabel.textContent = value === 'all' ? 'Alles' : value;
        pageSizeOptions.forEach(o => o.classList.toggle('active', o.dataset.value === String(value)));
        pageSizeWrap.classList.remove('open');
        pageSizeTrigger.setAttribute('aria-expanded', 'false');
        currentPage = 1;
        render();
    }
    search.addEventListener('input', e => { clearTimeout(window._t); window._t = setTimeout(() => { q = e.target.value; currentPage = 1; render(); }, 200); });
    pageSizeTrigger.addEventListener('click', e => {
        e.stopPropagation();
        const open = pageSizeWrap.classList.toggle('open');
        pageSizeTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    pageSizeOptions.forEach(o => o.addEventListener('click', e => {
        e.stopPropagation();
        setPageSize(o.dataset.value);
    }));
    document.addEventListener('click', e => {
        if (!pageSizeWrap.contains(e.target)) {
            pageSizeWrap.classList.remove('open');
            pageSizeTrigger.setAttribute('aria-expanded', 'false');
        }
    });
    prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; render(); } });
    nextBtn.addEventListener('click', () => { currentPage++; render(); });
    const MIN_SKELETON_TIME = 650;
    const loadingStartedAt = performance.now();
    document.addEventListener('DOMContentLoaded', async () => {
        const elapsed = performance.now() - loadingStartedAt;
        if (elapsed < MIN_SKELETON_TIME) await new Promise(r => setTimeout(r, MIN_SKELETON_TIME - elapsed));
        render();
        document.querySelector('.table').removeAttribute('aria-label');
        document.querySelector('.table').removeAttribute('aria-busy');
    });
</script>
</body>
</html>
