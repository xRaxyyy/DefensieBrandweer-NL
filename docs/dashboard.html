<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=block" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DEFENSIEBRANDWEER NL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;700&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">
    <link rel="stylesheet" href="style.css">
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/scrollbar.js"></script>
    <script src="js/modal.js"></script>
    <style>
        .dashboard-page { max-width:1280px; padding:128px 48px 88px; }
        .dashboard-header { margin-bottom:28px; }
        .dashboard-title { color:var(--text); font:700 clamp(44px,6vw,72px)/1 'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:0; margin:0 0 8px; }
        .dashboard-sub { color:var(--text-soft); font-size:18px; max-width:640px; }
        .stats-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin:28px 0; }
        .stat-card { background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--blue); border-radius:6px; padding:20px 22px; }
        .stat-value { color:var(--text); font:700 40px 'Barlow Condensed',sans-serif; margin-top:8px; min-height:48px; }
        .stat-value-skeleton { display:inline-block; width:48px; height:40px; border-radius:3px; background:var(--olive); color:transparent; position:relative; overflow:hidden; vertical-align:middle; }
        .stat-value-skeleton::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent); animation:dash-shimmer 1.4s infinite; }
        .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--border); }
        .tab-btn { min-height:40px; padding:8px 16px; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--text-soft); font:600 14px 'Barlow',sans-serif; cursor:pointer; transition:background-color 150ms,color 150ms,border-color 150ms; }
        .tab-btn:hover { background:var(--olive); color:#FFD078; border-color:var(--gold); }
        .tab-btn.active { background:var(--blue); color:#fff; border-color:var(--blue); }
        .toolbar { display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
        .search { display:flex; align-items:center; gap:10px; width:280px; min-height:44px; padding:8px 12px; border:1px solid var(--border); border-radius:4px; background:var(--surface); transition:border-color 150ms,box-shadow 150ms; }
        .search i { color:var(--gold); }
        .search input { border:none; outline:none; width:100%; background:transparent; color:var(--text); font:400 16px 'Barlow',sans-serif; }
        .search input::placeholder { color:var(--text-muted); }
        .search:focus-within { border-color:var(--gold); box-shadow:0 0 0 3px rgba(240,174,74,.18); }
        .search input:focus { outline:none; box-shadow:none; }
        .add-btn { min-height:44px; padding:9px 16px; background:var(--gold); color:#000; border:1px solid var(--gold); border-radius:4px; font:600 15px 'Barlow',sans-serif; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:background-color 150ms; }
        .add-btn:hover { background:#FFD078; border-color:#FFD078; }
        .table-container { background:var(--surface); border:1px solid var(--border); border-radius:6px; overflow-x:auto; margin-top:18px; }
        .table { width:100%; border-collapse:collapse; min-width:760px; table-layout:fixed; }
        .table thead th { padding:12px 16px; color:var(--text-muted); background:var(--bg-dark); border-bottom:1px solid var(--border); font:700 13px 'Barlow Condensed',sans-serif; letter-spacing:.1em; text-transform:uppercase; text-align:left; white-space:nowrap; }
        .table tbody td { padding:12px 16px; color:var(--text-soft); border-bottom:1px solid rgba(58,65,48,.7); font:400 14px 'Barlow',sans-serif; vertical-align:middle; }
        .table tbody tr:hover { background:#252D1D; }
        .table tbody tr:last-child td { border-bottom:0; }
        .item-preview { display:flex; align-items:center; gap:12px; }
        .item-image { width:48px; height:48px; border-radius:4px; overflow:hidden; background:var(--olive); border:1px solid var(--border); flex-shrink:0; }
        .item-image img { width:100%; height:100%; object-fit:cover; display:block; }
        .item-info h4 { color:var(--text); font:600 15px 'Barlow',sans-serif; margin:0; }
        .item-info .type { color:var(--text-muted); font-size:13px; }
        .status-badge { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:3px; font-weight:600; font-size:13px; white-space:nowrap; }
        .status-badge::before { content:''; width:6px; height:6px; border-radius:50%; background:#000; }
        .status-badge.active { color:var(--bg-dark); background:var(--gold); }
        .status-badge.inactive { color:var(--text-soft); background:var(--olive); border:1px solid var(--border); }
        .status-badge.other { color:var(--bg-dark); background:#F0AE4A; }
        .action-buttons { display:flex; gap:6px; justify-content:flex-end; }
        .action-btn { width:36px; height:36px; color:var(--text-soft); background:var(--surface); border:1px solid var(--border); border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background-color 150ms,color 150ms,border-color 150ms; }
        .action-btn:hover { color:var(--bg-dark); background:var(--gold); border-color:var(--gold); }
        .action-btn.delete:hover { color:#fff; background:var(--red); border-color:var(--red); }
        .table-empty { color:var(--text-muted); padding:48px 20px; text-align:center; }
        .table-empty i { color:var(--gold); font-size:36px; }
        .table-empty h3 { color:var(--text); font:700 22px 'Barlow Condensed',sans-serif; text-transform:uppercase; margin:12px 0 6px; }
        .skeleton-row { height:42px; }
        .skeleton-row td { padding:12px 16px; border-bottom:1px solid rgba(58,65,48,.7); height:42px; vertical-align:middle; }
        .skeleton-line { display:block; height:15px; border-radius:3px; background:var(--olive); position:relative; overflow:hidden; max-width:100%; }
        .skeleton-line { display:block; height:15px; border-radius:3px; background:var(--olive); position:relative; overflow:hidden; max-width:100%; }
        .skeleton-line::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent); animation:dash-shimmer 1.4s infinite; }
        @keyframes dash-shimmer { to { transform:translateX(100%); } }
        .stat-value { transition:opacity 200ms; }
        .modal-overlay { position:fixed; inset:0; background:rgba(8,10,7,.9); backdrop-filter:blur(12px); opacity:0; visibility:hidden; pointer-events:none; transition:opacity 230ms ease,visibility 0s linear 230ms; z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px; }
        .modal-overlay.open { opacity:1; visibility:visible; pointer-events:auto; transition-delay:0s; }
        .modal-content { background:var(--surface); border:1px solid var(--border); border-radius:6px; max-width:900px; width:100%; max-height:90vh; overflow:hidden; display:flex; flex-direction:column; }
        .modal-header { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
        .modal-title { color:var(--text); font:700 22px 'Barlow Condensed',sans-serif; text-transform:uppercase; margin:0; }
        .modal-close { width:40px; height:40px; border-radius:4px; background:var(--surface); border:1px solid var(--border); color:var(--text-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background-color 150ms,color 150ms,border-color 150ms; }
        .modal-close:hover { background:var(--gold); color:#000; border-color:var(--gold); }
        .modal-close i { font-size:14px; line-height:1; margin:0; }
        .modal-body { padding:22px; overflow-y:auto; flex:1; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .form-group { display:flex; flex-direction:column; gap:6px; }
        .form-full { grid-column:1 / -1; }
        .form-label { color:var(--text-soft); font:600 14px 'Barlow',sans-serif; }
        .form-input, .form-select { min-height:44px; padding:10px 13px; color:var(--text); background:var(--bg-dark); border:1px solid var(--border); border-radius:4px; font:400 15px 'Barlow',sans-serif; transition:border-color 150ms; }
        .form-input:focus, .form-select:focus { outline:none; border-color:var(--gold); }
        .form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; padding-top:18px; border-top:1px solid var(--border); }
        .save-button { min-height:44px; padding:10px 20px; background:var(--gold); color:#000; border:1px solid var(--gold); border-radius:4px; font:600 15px 'Barlow',sans-serif; cursor:pointer; transition:background-color 150ms; }
        .save-button:hover { background:#FFD078; border-color:#FFD078; }
        .cancel-button { min-height:44px; padding:10px 20px; background:var(--surface); color:var(--text-soft); border:1px solid var(--border); border-radius:4px; font:600 15px 'Barlow',sans-serif; cursor:pointer; transition:background-color 150ms,color 150ms; }
        .cancel-button:hover { background:var(--olive); color:#FFD078; border-color:var(--gold); }
        @media(max-width:900px) { .stats-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .form-grid { grid-template-columns:1fr; } .modal-content { max-width:100%; } }
        @media(max-width:640px) { .dashboard-page { padding:112px 20px 60px; } .stats-grid { grid-template-columns:1fr; } .toolbar { align-items:stretch; } .search { width:100%; } .add-btn { width:100%; } }
    </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="scroll-container"><div class="scroll-content">
<div class="page">
    <div class="dashboard-header">
        <div class="kicker">Beheer — Defensiebrandweer</div>
        <h1>Dashboard</h1>
        <p class="sub">Beheer alle data van het platform. Locaties, voertuigen, materieel en kentekens.</p>
    </div>
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Locaties</div><div class="stat-value" id="statLocations"><span class="stat-value-skeleton" aria-hidden="true"></span></div></div>
        <div class="stat-card"><div class="stat-label">Voertuigen</div><div class="stat-value" id="statVehicles"><span class="stat-value-skeleton" aria-hidden="true"></span></div></div>
        <div class="stat-card"><div class="stat-label">Materieel</div><div class="stat-value" id="statEquipment"><span class="stat-value-skeleton" aria-hidden="true"></span></div></div>
        <div class="stat-card"><div class="stat-label">Kentekens</div><div class="stat-value" id="statPlates"><span class="stat-value-skeleton" aria-hidden="true"></span></div></div>
    </div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="locations">Locaties</button>
        <button class="tab-btn" data-tab="vehicles">Voertuigen</button>
        <button class="tab-btn" data-tab="equipment">Materieel</button>
        <button class="tab-btn" data-tab="licenseplates">Kentekens</button>
    </div>
    <div class="toolbar">
        <label class="search"><i class="fi fi-rr-search"></i><input type="text" id="searchInput" placeholder="Zoeken..."></label>
        <button class="add-btn" id="addBtn"><i class="fas fa-plus"></i> Nieuw item</button>
    </div>
    <div class="table-container" id="tableContainer">
        <table class="table"><thead><tr><th>Locatie</th><th>Type</th><th>Plaats</th><th>Status</th><th style="text-align:right;">Acties</th></tr></thead><tbody>
            <tr class="skeleton-row"><td><span class="skeleton-line" style="width:60%"></span></td><td><span class="skeleton-line" style="width:40%"></span></td><td><span class="skeleton-line" style="width:70%"></span></td><td><span class="skeleton-line" style="width:50%"></span></td><td><span class="skeleton-line" style="width:30%"></span></td></tr>
            <tr class="skeleton-row"><td><span class="skeleton-line" style="width:70%"></span></td><td><span class="skeleton-line" style="width:45%"></span></td><td><span class="skeleton-line" style="width:60%"></span></td><td><span class="skeleton-line" style="width:50%"></span></td><td><span class="skeleton-line" style="width:30%"></span></td></tr>
            <tr class="skeleton-row"><td><span class="skeleton-line" style="width:55%"></span></td><td><span class="skeleton-line" style="width:50%"></span></td><td><span class="skeleton-line" style="width:65%"></span></td><td><span class="skeleton-line" style="width:50%"></span></td><td><span class="skeleton-line" style="width:30%"></span></td></tr>
        </tbody></table>
    </div>
</div>
<div id="footer-placeholder"></div>
</div><div class="custom-scrollbar-body"><div class="scrollbar-thumb"></div></div></div>

<div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">Item</h2>
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
    const API_BASE_URL = '/api';
    const MIN_SKELETON_TIME = 650;
    const loadingStartedAt = performance.now();
    let allData = { locations: [], vehicles: [], equipment: [], licenseplates: [] };
    let activeTab = 'locations';
    let editingItem = null;
    let isEditing = false;

    const tableContainer = document.getElementById('tableContainer');
    const searchInput = document.getElementById('searchInput');
    const addBtn = document.getElementById('addBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');

    function esc(s) { return (s || '').replace(/[&<>"]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : '&quot;'); }

    async function loadAllData() {
        const [locations, vehicles, equipment, licenseplates] = await Promise.all([
            fetch(`${API_BASE_URL}/locations`).then(r => r.ok ? r.json() : []),
            fetch(`${API_BASE_URL}/vehicles`).then(r => r.ok ? r.json() : []),
            fetch(`${API_BASE_URL}/equipment`).then(r => r.ok ? r.json() : []),
            fetch(`${API_BASE_URL}/licenseplates`).then(r => r.ok ? r.json() : [])
        ]);
        allData = { locations, vehicles, equipment, licenseplates };
        updateStats();
        renderTable();
    }

    function updateStats() {
        document.getElementById('statLocations').textContent = allData.locations.length;
        document.getElementById('statVehicles').textContent = allData.vehicles.length;
        document.getElementById('statEquipment').textContent = allData.equipment.length;
        document.getElementById('statPlates').textContent = allData.licenseplates.length;
    }

    function renderTable() {
        const term = (searchInput.value || '').toLowerCase();
        if (activeTab === 'locations') renderLocations(term);
        else if (activeTab === 'vehicles') renderVehicles(term);
        else if (activeTab === 'equipment') renderEquipment(term);
        else if (activeTab === 'licenseplates') renderPlates(term);
    }

    function itemImage(src) {
        return `<div class="item-image"><img src="${src || ''}" alt="" onerror="this.style.display='none'"></div>`;
    }

    function renderLocations(term) {
        let list = allData.locations || [];
        if (term) list = list.filter(l => [l.name, l.type, l.city, l.province].filter(Boolean).join(' ').toLowerCase().includes(term));
        if (!list.length) { tableContainer.innerHTML = `<div class="table-empty"><i class="fi fi-rr-marker"></i><h3>Geen locaties gevonden</h3><p>Voeg een locatie toe met de knop hierboven.</p></div>`; return; }
        tableContainer.innerHTML = `<table class="table"><thead><tr><th>Locatie</th><th>Type</th><th>Plaats</th><th>Status</th><th style="text-align:right;">Acties</th></tr></thead><tbody>${list.map(l => {
            const on = !l.yearTo || l.yearTo === 'Heden' || l.yearTo === 'heden' || l.yearTo === 'Actief';
            return `<tr><td><div class="item-preview">${itemImage(l.imageUrl)}<div class="item-info"><h4>${esc(l.name || '')}</h4><div class="type">${l.type || ''}</div></div></div></td><td class="wrap">${l.type || '–'}</td><td class="wrap">${[l.city, l.province].filter(Boolean).join(', ') || '–'}</td><td><span class="status-badge ${on ? 'active' : 'inactive'}">${on ? 'Actief' : 'Historisch'}</span></td><td><div class="action-buttons"><button class="action-btn edit" onclick="editItem('${l.id}','locations')" title="Bewerken"><i class="fas fa-edit"></i></button><button class="action-btn delete" onclick="deleteItem('${l.id}','locations')" title="Verwijderen"><i class="fas fa-trash"></i></button></div></td></tr>`;
        }).join('')}</tbody></table>`;
    }

    function renderVehicles(term) {
        let list = allData.vehicles || [];
        if (term) list = list.filter(v => [v.naam, v.merk, v.type, v.leverancier].filter(Boolean).join(' ').toLowerCase().includes(term));
        if (!list.length) { tableContainer.innerHTML = `<div class="table-empty"><i class="fi fi-rr-truck-moving"></i><h3>Geen voertuigen gevonden</h3><p>Voeg een voertuig toe met de knop hierboven.</p></div>`; return; }
        tableContainer.innerHTML = `<table class="table"><thead><tr><th>Voertuig</th><th>Merk / Type</th><th>Bouwjaar</th><th>Status</th><th style="text-align:right;">Acties</th></tr></thead><tbody>${list.map(v => {
            const on = v.status === 'Actief' || !v.yearTo;
            const title = v.naam || [v.merk, v.type].filter(Boolean).join(' ') || 'Onbekend';
            return `<tr><td><div class="item-preview">${itemImage(v.imageUrl)}<div class="item-info"><h4>${esc(title)}</h4><div class="type">${[v.merk, v.type].filter(Boolean).join(' • ')}</div></div></div></td><td class="wrap">${[v.merk, v.type].filter(Boolean).join(' / ') || '–'}</td><td>${v.bouwjaar || '–'}</td><td><span class="status-badge ${on ? 'active' : 'inactive'}">${v.status || 'Actief'}</span></td><td><div class="action-buttons"><button class="action-btn edit" onclick="editItem('${v.id}','vehicles')" title="Bewerken"><i class="fas fa-edit"></i></button><button class="action-btn delete" onclick="deleteItem('${v.id}','vehicles')" title="Verwijderen"><i class="fas fa-trash"></i></button></div></td></tr>`;
        }).join('')}</tbody></table>`;
    }

    function renderEquipment(term) {
        let list = allData.equipment || [];
        if (term) list = list.filter(e => [e.name, e.category, e.description].filter(Boolean).join(' ').toLowerCase().includes(term));
        if (!list.length) { tableContainer.innerHTML = `<div class="table-empty"><i class="fi fi-rr-tools"></i><h3>Geen materieel gevonden</h3><p>Voeg materieel toe met de knop hierboven.</p></div>`; return; }
        tableContainer.innerHTML = `<table class="table"><thead><tr><th>Materieel</th><th>Categorie</th><th>Jaar</th><th style="text-align:right;">Acties</th></tr></thead><tbody>${list.map(e => `<tr><td><div class="item-preview">${itemImage(e.imageUrl)}<div class="item-info"><h4>${esc(e.name || '')}</h4><div class="type">${e.description || ''}</div></div></div></td><td class="wrap">${e.category || '–'}</td><td>${e.year || '–'}</td><td><div class="action-buttons"><button class="action-btn edit" onclick="editItem('${e.id}','equipment')" title="Bewerken"><i class="fas fa-edit"></i></button><button class="action-btn delete" onclick="deleteItem('${e.id}','equipment')" title="Verwijderen"><i class="fas fa-trash"></i></button></div></td></tr>`).join('')}</tbody></table>`;
    }

    function renderPlates(term) {
        let list = allData.licenseplates || [];
        if (term) list = list.filter(p => [p.kenteken, p.naam].filter(Boolean).join(' ').toLowerCase().includes(term));
        if (!list.length) { tableContainer.innerHTML = `<div class="table-empty"><i class="fi fi-rr-id-card"></i><h3>Geen kentekens gevonden</h3><p>Voeg een kenteken toe met de knop hierboven.</p></div>`; return; }
        tableContainer.innerHTML = `<table class="table"><thead><tr><th>Kenteken</th><th>Gekoppeld voertuig</th><th>Status</th><th style="text-align:right;">Acties</th></tr></thead><tbody>${list.map(p => {
            const veh = p.koppelVoertuigId ? allData.vehicles.find(v => v.id === p.koppelVoertuigId) : null;
            return `<tr><td><div class="item-preview">${itemImage(p.imageUrl)}<div class="item-info"><h4>${esc(p.kenteken || '')}</h4><div class="type">${p.id || ''}</div></div></div></td><td class="wrap">${veh ? esc(veh.naam || '') : 'Geen koppeling'}</td><td><span class="status-badge ${p.status === 'Actief' ? 'active' : 'other'}">${p.status || 'Actief'}</span></td><td><div class="action-buttons"><button class="action-btn edit" onclick="editItem('${p.id}','licenseplates')" title="Bewerken"><i class="fas fa-edit"></i></button><button class="action-btn delete" onclick="deleteItem('${p.id}','licenseplates')" title="Verwijderen"><i class="fas fa-trash"></i></button></div></td></tr>`;
        }).join('')}</tbody></table>`;
    }

    function openModal(title, bodyHtml) {
        modalTitle.textContent = title;
        modalBody.innerHTML = bodyHtml;
        modalOverlay.style.display = 'flex';
        requestAnimationFrame(() => modalOverlay.classList.add('open'));
    }

    function closeModal() {
        modalOverlay.classList.remove('open');
        setTimeout(() => { modalOverlay.style.display = 'none'; }, 230);
    }

    function editItem(id, type) {
        let item = null;
        if (type === 'locations') item = allData.locations.find(x => x.id === id);
        else if (type === 'vehicles') item = allData.vehicles.find(x => x.id === id);
        else if (type === 'equipment') item = allData.equipment.find(x => x.id === id);
        else if (type === 'licenseplates') item = allData.licenseplates.find(x => x.id === id);
        isEditing = !!item;
        editingItem = item;
        const name = type === 'locations' ? 'Locatie' : type === 'vehicles' ? 'Voertuig' : type === 'equipment' ? 'Materieel' : 'Kenteken';
        modalTitle.textContent = isEditing ? `${name} bewerken` : `Nieuw ${name}`;

        let fields = '';
        if (type === 'locations') {
            fields = `
                <div class="form-group"><label class="form-label">Naam *</label><input class="form-input" id="f_name" value="${esc(item?.name || '')}" required></div>
                <div class="form-group"><label class="form-label">Type</label><input class="form-input" id="f_type" value="${esc(item?.type || '')}"></div>
                <div class="form-group"><label class="form-label">Stad</label><input class="form-input" id="f_city" value="${esc(item?.city || '')}"></div>
                <div class="form-group"><label class="form-label">Provincie</label><input class="form-input" id="f_province" value="${esc(item?.province || '')}"></div>
                <div class="form-group"><label class="form-label">Van (jaar)</label><input class="form-input" id="f_yearFrom" value="${esc(item?.yearFrom || '')}"></div>
                <div class="form-group"><label class="form-label">Tot (jaar)</label><input class="form-input" id="f_yearTo" value="${esc(item?.yearTo || '')}"></div>
                <div class="form-full"><div class="form-group"><label class="form-label">Beschrijving</label><textarea class="form-input" id="f_desc" rows="3">${esc(item?.description || '')}</textarea></div></div>
                <div class="form-full"><div class="form-group"><label class="form-label">Afbeelding</label><input type="file" id="f_imageFile" accept="image/*" class="form-input"><input type="hidden" id="f_image" value="${esc(item?.imageUrl || '')}">${item?.imageUrl ? `<img src="${esc(item.imageUrl)}" style="max-width:200px;margin-top:8px;border-radius:4px;">` : ''}</div></div>`;
        } else if (type === 'vehicles') {
            fields = `
                <div class="form-group"><label class="form-label">Naam</label><input class="form-input" id="f_naam" value="${esc(item?.naam || '')}"></div>
                <div class="form-group"><label class="form-label">Merk</label><input class="form-input" id="f_merk" value="${esc(item?.merk || '')}"></div>
                <div class="form-group"><label class="form-label">Type</label><input class="form-input" id="f_type" value="${esc(item?.type || '')}"></div>
                <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="f_status"><option ${item?.status === 'Actief' ? 'selected' : ''}>Actief</option><option ${item?.status === 'Historisch' ? 'selected' : ''}>Historisch</option></select></div>
                <div class="form-group"><label class="form-label">Bouwjaar</label><input class="form-input" id="f_bouwjaar" value="${esc(item?.bouwjaar || '')}"></div>
                <div class="form-group"><label class="form-label">Van (jaar)</label><input class="form-input" id="f_yearFrom" value="${esc(item?.yearFrom || '')}"></div>
                <div class="form-group"><label class="form-label">Tot (jaar)</label><input class="form-input" id="f_yearTo" value="${esc(item?.yearTo || '')}"></div>
                <div class="form-full"><div class="form-group"><label class="form-label">Afbeelding</label><input type="file" id="f_imageFile" accept="image/*" class="form-input"><input type="hidden" id="f_image" value="${esc(item?.imageUrl || '')}">${item?.imageUrl ? `<img src="${esc(item.imageUrl)}" style="max-width:200px;margin-top:8px;border-radius:4px;">` : ''}</div></div>`;
        } else if (type === 'equipment') {
            fields = `
                <div class="form-group"><label class="form-label">Naam</label><input class="form-input" id="f_name" value="${esc(item?.name || '')}"></div>
                <div class="form-group"><label class="form-label">Categorie</label><input class="form-input" id="f_category" value="${esc(item?.category || '')}"></div>
                <div class="form-full"><div class="form-group"><label class="form-label">Beschrijving</label><textarea class="form-input" id="f_desc" rows="3">${esc(item?.description || '')}</textarea></div></div>
                <div class="form-group"><label class="form-label">Jaar</label><input class="form-input" id="f_year" value="${esc(item?.year || '')}"></div>
                <div class="form-full"><div class="form-group"><label class="form-label">Afbeelding</label><input type="file" id="f_imageFile" accept="image/*" class="form-input"><input type="hidden" id="f_image" value="${esc(item?.imageUrl || '')}">${item?.imageUrl ? `<img src="${esc(item.imageUrl)}" style="max-width:200px;margin-top:8px;border-radius:4px;">` : ''}</div></div>`;
        } else if (type === 'licenseplates') {
            fields = `
                <div class="form-group"><label class="form-label">Kenteken *</label><input class="form-input" id="f_kenteken" value="${esc(item?.kenteken || '')}" required></div>
                <div class="form-group"><label class="form-label">Naam</label><input class="form-input" id="f_naam" value="${esc(item?.naam || '')}"></div>
                <div class="form-group"><label class="form-label">Merk</label><input class="form-input" id="f_merk" value="${esc(item?.merk || '')}"></div>
                <div class="form-group"><label class="form-label">Type</label><input class="form-input" id="f_type" value="${esc(item?.type || '')}"></div>
                <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="f_status"><option ${item?.status === 'Actief' ? 'selected' : ''}>Actief</option><option ${item?.status === 'Historisch' ? 'selected' : ''}>Historisch</option></select></div>
                <div class="form-group"><label class="form-label">Bouwjaar</label><input class="form-input" id="f_bouwjaar" value="${esc(item?.bouwjaar || '')}"></div>
                <div class="form-group"><label class="form-label">Locatie</label><input class="form-input" id="f_locatie" value="${esc(item?.locatie || '')}"></div>
                <div class="form-group"><label class="form-label">Roepnr.</label><input class="form-input" id="f_roepnr" value="${esc(item?.roepnr || '')}"></div>
                <div class="form-full"><div class="form-group"><label class="form-label">Afbeelding</label><input type="file" id="f_imageFile" accept="image/*" class="form-input"><input type="hidden" id="f_image" value="${esc(item?.imageUrl || '')}">${item?.imageUrl ? `<img src="${esc(item.imageUrl)}" style="max-width:200px;margin-top:8px;border-radius:4px;">` : ''}</div></div>`;
        }

        modalBody.innerHTML = `<div class="form-grid">${fields}</div><div class="form-actions"><button class="save-button" onclick="saveItem('${type}','${id || ''}')">Opslaan</button><button type="button" class="cancel-button" onclick="closeModal()">Annuleren</button></div>`;
        openModal(modalTitle.textContent, modalBody.innerHTML);
    }

    async function saveItem(type, id) {
        let imageUrl = document.getElementById('f_image')?.value || '';
        const fileInput = document.getElementById('f_imageFile');
        if (fileInput && fileInput.files && fileInput.files[0]) {
            const fd = new FormData();
            fd.append('image', fileInput.files[0]);
            try {
                const upRes = await fetch(`${API_BASE_URL}/upload`, { method: 'POST', body: fd });
                if (upRes.ok) {
                    const upData = await upRes.json();
                    imageUrl = upData.url || upData.imageUrl || imageUrl;
                }
            } catch (e) { console.error('Upload mislukt', e); }
        }
        if (type === 'locations') {
            data = { name: document.getElementById('f_name')?.value, type: document.getElementById('f_type')?.value, city: document.getElementById('f_city')?.value, province: document.getElementById('f_province')?.value, yearFrom: document.getElementById('f_yearFrom')?.value, yearTo: document.getElementById('f_yearTo')?.value, description: document.getElementById('f_desc')?.value, imageUrl: imageUrl };
        } else if (type === 'vehicles') {
            data = { naam: document.getElementById('f_naam')?.value, merk: document.getElementById('f_merk')?.value, type: document.getElementById('f_type')?.value, status: document.getElementById('f_status')?.value, bouwjaar: document.getElementById('f_bouwjaar')?.value, yearFrom: document.getElementById('f_yearFrom')?.value, yearTo: document.getElementById('f_yearTo')?.value, imageUrl: imageUrl };
        } else if (type === 'equipment') {
            data = { name: document.getElementById('f_name')?.value, category: document.getElementById('f_category')?.value, description: document.getElementById('f_desc')?.value, year: document.getElementById('f_year')?.value, imageUrl: imageUrl };
        } else if (type === 'licenseplates') {
            data = { kenteken: document.getElementById('f_kenteken')?.value?.toUpperCase(), naam: document.getElementById('f_naam')?.value, merk: document.getElementById('f_merk')?.value, type: document.getElementById('f_type')?.value, status: document.getElementById('f_status')?.value, bouwjaar: document.getElementById('f_bouwjaar')?.value, locatie: document.getElementById('f_locatie')?.value, roepnr: document.getElementById('f_roepnr')?.value, imageUrl: imageUrl };
        }
        if (type === 'locations' && !data.name) { alert('Naam is verplicht'); return; }
        if (type === 'licenseplates' && !data.kenteken) { alert('Kenteken is verplicht'); return; }
        const endpoint = type === 'locations' ? 'locations' : type === 'vehicles' ? 'vehicles' : type === 'equipment' ? 'equipment' : 'licenseplates';
        try {
            let url = `${API_BASE_URL}/${endpoint}`;
            let method = 'POST';
            if (isEditing && editingItem?.id) { url = `${API_BASE_URL}/${endpoint}/${editingItem.id}`; method = 'PUT'; }
            const response = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            if (!response.ok) { const err = await response.json(); throw new Error(err.error || 'Opslaan mislukt'); }
            closeModal();
            await loadAllData();
        } catch (e) { alert('Opslaan mislukt: ' + e.message); }
    }

    async function deleteItem(id, type) {
        if (!confirm('Weet u zeker dat u dit item wilt verwijderen?')) return;
        const endpoint = type === 'locations' ? 'locations' : type === 'vehicles' ? 'vehicles' : type === 'equipment' ? 'equipment' : 'licenseplates';
        try {
            await fetch(`${API_BASE_URL}/${endpoint}/${id}`, { method: 'DELETE' });
            await loadAllData();
        } catch (e) { alert('Verwijderen mislukt'); }
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        const names = { locations: 'Locatie', vehicles: 'Voertuig', equipment: 'Materieel', licenseplates: 'Kenteken' };
        addBtn.innerHTML = `<i class="fas fa-plus"></i> Nieuw ${names[activeTab]}`;
        renderTable();
    }));

    searchInput.addEventListener('input', () => renderTable());
    addBtn.addEventListener('click', () => editItem(null, activeTab === 'locations' ? 'locations' : activeTab === 'vehicles' ? 'vehicles' : activeTab === 'equipment' ? 'equipment' : 'licenseplates'));
    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

    (async () => {
        const elapsed = performance.now() - loadingStartedAt;
        if (elapsed < MIN_SKELETON_TIME) await new Promise(r => setTimeout(r, MIN_SKELETON_TIME - elapsed));
        await loadAllData();
    })();

    window.editItem = editItem;
    window.saveItem = saveItem;
    window.deleteItem = deleteItem;
    window.closeModal = closeModal;
</script>
</body>
</html>
