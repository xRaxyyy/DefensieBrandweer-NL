<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=block" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locaties - DEFENSIEBRANDWEER NL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;700&display=block" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-brands/css/uicons-brands.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/scrollbar.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:28px; }
        .map-wrap { margin-top:28px; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:6px; }
        #map { height:min(64vh,620px); min-height:360px; width:100%; background:var(--bg-dark); z-index:1; }
        .legend { display:flex; gap:16px; flex-wrap:wrap; padding:14px 18px; background:var(--surface); border-top:1px solid var(--border); color:var(--text-soft); font:500 14px 'Barlow',sans-serif; }
        .legend span { display:inline-flex; align-items:center; gap:8px; }
        .legend i { width:8px; height:8px; border-radius:50%; display:inline-block; }
        .leaflet-popup-content-wrapper { border-radius:6px !important; padding:0 !important; overflow:hidden !important; background:var(--surface) !important; color:var(--text) !important; border:1px solid var(--border); }
        .leaflet-popup-tip { background:var(--surface) !important; }
        .leaflet-popup-content { margin:0 !important; width:280px !important; font-family:'Barlow',sans-serif !important; line-height:1.5 !important; }
        .leaflet-popup-content a { color:var(--gold); font-weight:600; text-decoration:none; }
        .leaflet-popup-content a:hover { text-decoration:underline; text-underline-offset:3px; }
        .leaflet-container a.leaflet-popup-close-button { color:var(--text-soft); }
        .leaflet-control-zoom a { background:var(--surface) !important; color:var(--text) !important; border-color:var(--border) !important; }
        .leaflet-control-attribution { background:rgba(12,14,9,.85) !important; color:var(--text-muted) !important; }
        .leaflet-control-attribution a { color:var(--gold) !important; }
        .location-skeleton { min-height:470px; pointer-events:none; }
        .location-skeleton-image { display:block; width:100%; aspect-ratio:4/3; background:var(--olive); }
        .location-skeleton-copy { display:flex; flex-direction:column; gap:9px; padding:20px 22px 22px; }
        .location-skeleton-line { display:block; width:72%; height:15px; border-radius:3px; background:var(--olive); }
        .location-skeleton-line.category { width:40%; height:12px; }
        .location-skeleton-line.title { width:92%; height:26px; }
        .location-skeleton-line.detail { width:70%; height:23px; }
        .location-skeleton-meta { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:8px; padding-top:14px; border-top:1px solid var(--border); }
        .location-skeleton-date { display:block !important; width:136px; height:14px; border-radius:3px; background:var(--olive); }
        .location-skeleton-arrow { width:44px; height:44px; flex:0 0 44px; border:1px solid var(--border); border-radius:4px; background:var(--olive); }
        .location-skeleton-image,.location-skeleton-line,.location-skeleton-date,.location-skeleton-arrow,.filter-skeleton { position:relative; overflow:hidden; }
        .location-skeleton-image::after,.location-skeleton-line::after,.location-skeleton-date::after,.location-skeleton-arrow::after,.filter-skeleton::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent); animation:location-shimmer 1.4s infinite; }
        .grid > .card:not(.location-skeleton) { animation:location-card-enter .35s ease both; }
        #typeFilters button { animation:location-card-enter .3s ease both; }
        #resultsCount { animation:location-card-enter .3s ease both; }
        .filter-skeleton { display:inline-block; width:112px; height:42px; border-radius:4px; background:var(--olive); vertical-align:middle; }
        @keyframes location-shimmer { to { transform:translateX(100%); } }
        @keyframes location-card-enter { from { opacity:0; } to { opacity:1; } }
        .location-skeleton-line.short { width:72px; height:14px; margin:0; }
        @media (max-width:1024px) {
            .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .toolbar { gap:12px; }
        }
        @media (max-width:640px) {
            #typeFilters button { flex:0 1 auto; }
            .views { width:100%; }
            .views button { flex:1; justify-content:center; }
            .grid { grid-template-columns:1fr; gap:16px; }
            #map { min-height:320px; height:55vh; }
        }
    </style>
</head>
<body class="locations-overview">
<div id="navbar-placeholder"></div>
<div class="scroll-container"><div class="scroll-content">
<div class="page">
    <div class="kicker">Overzicht — Defensiebrandweer</div>
    <h1>Loca<span>ties</span></h1>
    <p class="sub">Van vliegbases tot kazernes. Zoek op naam, plaats of type, en filter op status.</p>
    <div class="toolbar">
        <label class="search"><i class="fi fi-rr-search"></i><input type="text" id="searchInput" placeholder="Zoeken..."></label>
        <div class="cats" id="statusFilters">
            <button data-filter="all" class="active">Alles</button>
            <button data-filter="active">Actief</button>
            <button data-filter="historical">Historisch</button>
        </div>
        <div class="cats" id="typeFilters"><span class="filter-skeleton" aria-hidden="true"></span></div>
        <div class="views">
            <button data-view="list" class="active"><i class="fi fi-rr-list"></i>Lijst</button>
            <button data-view="map"><i class="fi fi-rr-map"></i>Kaart</button>
        </div>
        <span class="count" id="resultsCount"><span class="location-skeleton-line short" aria-hidden="true"></span></span>
    </div>
    <div id="listView">
        <div class="grid" id="locationsGrid" aria-label="Locaties laden" aria-busy="true"><div class="card location-skeleton" aria-hidden="true"><span class="img location-skeleton-image"></span><div class="body location-skeleton-copy"><span class="location-skeleton-line category"></span><span class="location-skeleton-line title"></span><span class="location-skeleton-line detail"></span><div class="location-skeleton-meta"><span class="date location-skeleton-date"></span><span class="location-skeleton-arrow"></span></div></div></div><div class="card location-skeleton" aria-hidden="true"><span class="img location-skeleton-image"></span><div class="body location-skeleton-copy"><span class="location-skeleton-line category"></span><span class="location-skeleton-line title"></span><span class="location-skeleton-line detail"></span><div class="location-skeleton-meta"><span class="date location-skeleton-date"></span><span class="location-skeleton-arrow"></span></div></div></div><div class="card location-skeleton" aria-hidden="true"><span class="img location-skeleton-image"></span><div class="body location-skeleton-copy"><span class="location-skeleton-line category"></span><span class="location-skeleton-line title"></span><span class="location-skeleton-line detail"></span><div class="location-skeleton-meta"><span class="date location-skeleton-date"></span><span class="location-skeleton-arrow"></span></div></div></div></div>
        <div class="empty" id="noResults" style="display:none;">
            <i class="fi fi-rr-marker"></i>
            <h3>Niets gevonden</h3>
            <p>Pas je zoekopdracht of filters aan.</p>
            <button id="resetFiltersBtn"><i class="fas fa-rotate-left"></i> Reset filters</button>
        </div>
    </div>
    <div id="mapView" style="display:none;">
        <div class="map-wrap">
            <div id="map"></div>
            <div class="legend" id="legend"></div>
        </div>
        <div class="empty" id="noMapResults" style="display:none;">
            <i class="fi fi-rr-marker"></i>
            <h3>Niets gevonden</h3>
            <p>Pas je zoekopdracht of filters aan.</p>
            <button id="resetMapFiltersBtn"><i class="fas fa-rotate-left"></i> Reset filters</button>
        </div>
    </div>
</div>
<div id="footer-placeholder"></div>
</div><div class="custom-scrollbar-body"><div class="scrollbar-thumb"></div></div></div>
<script>
    const API_BASE_URL = '/api';
    const FALLBACK = 'https://images.unsplash.com/photo-1582131503261-fca1c9bcec44?auto=format&fit=crop&q=80&w=800';
    const MIN_SKELETON_TIME = 650;
    const loadingStartedAt = performance.now();
    let allLocations = [];
    let activeFilter = 'all', activeType = 'all', searchTerm = '', activeView = 'list';
    let map = null, markersLayer = null, mapInit = false;
    const grid = document.getElementById('locationsGrid'), noResults = document.getElementById('noResults'),
        noMapResults = document.getElementById('noMapResults'),
        searchInput = document.getElementById('searchInput'), resultsCount = document.getElementById('resultsCount'),
        resetBtn = document.getElementById('resetFiltersBtn'), resetMapBtn = document.getElementById('resetMapFiltersBtn'),
        typeFilters = document.getElementById('typeFilters'),
        listView = document.getElementById('listView'), mapView = document.getElementById('mapView');

    const isActive = (loc) => loc.yearTo === 'Heden' || loc.yearTo === 'heden' || loc.yearTo === 'Actief' || !loc.yearTo;

    async function fetchLocations() {
        try {
            const res = await fetch(`${API_BASE_URL}/locations`);
            if (!res.ok) throw new Error('API error');
            return await res.json();
        } catch (e) { return []; }
    }

    function renderTypeFilters() {
        const types = [...new Set(allLocations.map(l => l.type).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'nl'));
        typeFilters.innerHTML = `<button data-type="all" class="${activeType === 'all' ? 'active' : ''}">Alle types</button>`
            + types.map(t => `<button data-type="${t.replace(/"/g, '&quot;')}" class="${activeType === t ? 'active' : ''}">${t}</button>`).join('');
        typeFilters.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
            typeFilters.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
            activeType = b.dataset.type;
            applyFilters();
        }));
    }

    function filtered() {
        const q = searchTerm.toLowerCase();
        return allLocations.filter(l => {
            const on = isActive(l);
            if (activeFilter === 'active' && !on) return false;
            if (activeFilter === 'historical' && on) return false;
            if (activeType !== 'all' && l.type !== activeType) return false;
            if (q) {
                const hay = [l.name, l.type, l.city, l.province].filter(Boolean).join(' ').toLowerCase();
                if (!hay.includes(q)) return false;
            }
            return true;
        });
    }

    function cardHTML(l) {
        const on = isActive(l);
        const place = [l.city, l.province].filter(Boolean).join(', ');
        return `<a class="card" href="locatie-detail?id=${encodeURIComponent(l.id || '')}">
            <div class="img"><img src="${l.imageUrl || FALLBACK}" alt="" onerror="this.src='${FALLBACK}'"><span class="status ${on ? 'on' : 'off'}">${on ? 'Actief' : 'Historisch'}</span></div>
            <div class="body"><div class="cat">${l.type || 'Locatie'}</div><h3>${l.name || ''}</h3>
            ${place ? `<div class="sub2"><i class="fi fi-rr-marker"></i>${place}</div>` : ''}
            <div class="meta"><span class="date"><i class="fi fi-rr-calendar"></i><span>${l.yearFrom || '?'} – ${l.yearTo || 'heden'}</span></span><span class="go"><i class="fi fi-rr-arrow-right"></i></span></div></div></a>`;
    }

    function applyFilters() {
        const list = filtered();
        resultsCount.textContent = `${list.length} ${list.length === 1 ? 'locatie' : 'locaties'}`;
        if (activeView === 'list') renderList(list);
        else renderMap(list);
    }

    function renderList(list) {
        if (!list.length) { grid.style.display = 'none'; noResults.style.display = 'block'; return; }
        grid.style.display = 'grid'; noResults.style.display = 'none';
        grid.innerHTML = list.map(cardHTML).join('');
        grid.removeAttribute('aria-label');
        grid.removeAttribute('aria-busy');
    }

    function ensureMap() {
        if (mapInit) return;
        mapInit = true;
        map = L.map('map').setView([52.1, 5.3], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
        document.getElementById('legend').innerHTML =
            '<span><i style="background:#F0AE4A"></i>Actief</span><span><i style="background:#8a8f7d"></i>Historisch</span>';
    }

    function renderMap(list) {
        ensureMap();
        markersLayer.clearLayers();
        const withCoords = list.filter(l => Number.isFinite(+l.lat) && Number.isFinite(+l.lng));
        if (!list.length) {
            document.querySelector('.map-wrap').style.display = 'none';
            noMapResults.style.display = 'block';
            return;
        }
        document.querySelector('.map-wrap').style.display = '';
        noMapResults.style.display = 'none';
        const bounds = [];
        withCoords.forEach(l => {
            const on = isActive(l);
            const m = L.circleMarker([+l.lat, +l.lng], {
                radius: 8,
                color: on ? '#F0AE4A' : '#8a8f7d',
                weight: 2,
                fillColor: on ? '#F0AE4A' : '#8a8f7d',
                fillOpacity: 0.85
            });
            m.bindPopup(`<strong>${l.name || ''}</strong><br>${[l.type, [l.city, l.province].filter(Boolean).join(', ')].filter(Boolean).join(' • ')}<br><a href="locatie-detail?id=${encodeURIComponent(l.id || '')}">Bekijk locatie</a>`);
            markersLayer.addLayer(m);
            bounds.push([+l.lat, +l.lng]);
        });
        setTimeout(() => {
            map.invalidateSize();
            if (bounds.length) map.fitBounds(bounds, { padding: [40, 40] });
        }, 50);
    }

    function setView(view) {
        activeView = view;
        document.querySelectorAll('.views button').forEach(x => x.classList.toggle('active', x.dataset.view === view));
        listView.style.display = view === 'list' ? '' : 'none';
        mapView.style.display = view === 'map' ? '' : 'none';
        applyFilters();
    }

    document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
    document.querySelectorAll('#statusFilters button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#statusFilters button').forEach(x => x.classList.toggle('active', x === b));
        activeFilter = b.dataset.filter;
        applyFilters();
    }));
    let t;
    searchInput.addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { searchTerm = e.target.value; applyFilters(); }, 250); });
    function resetAll() {
        searchInput.value = ''; searchTerm = ''; activeFilter = 'all'; activeType = 'all';
        document.querySelectorAll('#statusFilters button').forEach(x => x.classList.toggle('active', x.dataset.filter === 'all'));
        renderTypeFilters();
        applyFilters();
    }
    resetBtn.addEventListener('click', resetAll);
    resetMapBtn.addEventListener('click', resetAll);
    document.addEventListener('DOMContentLoaded', async () => {
        allLocations = await fetchLocations();
        renderTypeFilters();
        const elapsed = performance.now() - loadingStartedAt;
        if (elapsed < MIN_SKELETON_TIME) await new Promise(r => setTimeout(r, MIN_SKELETON_TIME - elapsed));
        applyFilters();
    });
</script>
</body>
</html>
